# 다나와 크롤링 → 가격 추이 기록(history/prices.json) → csv 브랜치에 CSV 저장 → Apps Script 웹 앱으로 시트 가져오기 + data.json 업로드
# 시각은 UTC 기준입니다. 23:50 UTC = 한국 08:50, 08:50 UTC = 한국 17:50
# (GitHub 예약 실행은 정각에 몰려 10~30분씩 늦게 시작하는 경우가 많아 10분 일찍 잡았습니다)
name: 다나와 크롤링

on:
  schedule:
    - cron: '50 23 * * *'   # 한국 08:50 정기 실행
    - cron: '50 8 * * *'    # 한국 17:50 정기 실행
    - cron: '10 4 * * *'    # 한국 13:10 보충: 아침 크롤링이 안 됐을 때만 실행
    - cron: '10 15 * * *'   # 한국 00:10 보충: 저녁 크롤링이 안 됐을 때만 실행
  workflow_dispatch:
    inputs:
      categories:
        description: '일부만 돌릴 때 카테고리 이름 (쉼표로 구분, 비우면 전체)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: danawa-crawl
  cancel-in-progress: false

jobs:
  # 보충 실행(13:10, 00:10)은 마지막 크롤링이 10시간 넘게 지났을 때만 진행 (GitHub 장애 등으로 정기 실행을 건너뛴 경우)
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$SCHED" = "50 23 * * *" ] || [ "$SCHED" = "50 8 * * *" ]; then
            echo "정기 실행 또는 직접 실행 → 진행"; echo "run=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/commits?sha=csv&per_page=1" \
                 | python3 -c "import json,sys,datetime as d; c=json.load(sys.stdin)[0]['commit']['committer']['date']; print(int(d.datetime.fromisoformat(c.replace('Z','+00:00')).timestamp()))" 2>/dev/null)
          if [ -z "$last" ]; then echo "마지막 크롤링 시각을 알 수 없음 → 진행"; echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ($(date +%s) - last) / 3600 ))
          echo "마지막 크롤링: $(TZ=Asia/Seoul date -d @$last '+%m/%d %H:%M') (${age}시간 전)"
          if [ "$age" -ge 10 ]; then echo "이전 크롤링이 안 된 것으로 보고 보충 실행"; echo "run=1" >> "$GITHUB_OUTPUT"
          else echo "이전 크롤링 정상 → 건너뜀"; echo "run=0" >> "$GITHUB_OUTPUT"; fi

  crawl:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install -U selenium pytz

      - name: 크롤링
        env:
          CATEGORIES: ${{ github.event.inputs.categories }}
        run: python crawler/crawl_actions.py

      - name: 가격 추이 기록 (history/prices.json)
        if: always()
        run: |
          python crawler/build_history.py || { echo "가격 기록 실패 (크롤링 결과에는 영향 없음)"; exit 0; }
          [ -f history/prices.json ] || exit 0
          git add history/prices.json
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "가격 기록 $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git fetch -q --depth=50 origin main && git rebase -q origin/main && git push -q origin HEAD:main && { echo "가격 기록 올림"; exit 0; }
            echo "올리기 재시도 $i"; sleep 5
          done
          echo "가격 기록을 올리지 못함 (다음 크롤링 때 이어서 기록)"

      - name: CSV를 csv 브랜치에 저장
        if: always()
        run: |
          shopt -s nullglob
          files=(crawler/crawl_data/*.csv)
          if [ ${#files[@]} -eq 0 ]; then echo "새 CSV 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin csv:refs/remotes/origin/csv 2>/dev/null; then
            git worktree add -B csv ../csvwt origin/csv
          else
            git worktree add --detach ../csvwt
            (cd ../csvwt && git checkout --orphan csv && git rm -rf -q . )
          fi
          cp "${files[@]}" ../csvwt/
          cd ../csvwt
          git add -- *.csv
          if git diff --cached --quiet; then echo "바뀐 CSV 없음"; else
            git commit -q -m "다나와 가격 $(date '+%Y-%m-%d %H:%M')"
            git push -q origin csv
          fi

      - name: 시트 가져오기 + data.json 업로드
        if: success()
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          WEBAPP_KEY: ${{ secrets.WEBAPP_KEY }}
        run: |
          if [ -z "$WEBAPP_URL" ] || [ -z "$WEBAPP_KEY" ]; then echo "WEBAPP_URL / WEBAPP_KEY 시크릿이 없어 건너뜀"; exit 0; fi
          note="$(date '+%m/%d %H:%M') 자동 실행 · $(cat crawler/crawl_summary.txt 2>/dev/null)"
          res=$(curl -sSL --max-time 600 -G "$WEBAPP_URL" \
                --data-urlencode "key=$WEBAPP_KEY" --data-urlencode "action=import" \
                --data-urlencode "source=github" --data-urlencode "note=$note")
          echo "$res" | python -c "import json,sys; r=json.load(sys.stdin); [print(x) for x in r.get('logs',[])]; [print('오류:',x) for x in r.get('errors',[])]; print(r.get('error','')); sys.exit(0 if r.get('ok') else 1)"

      - name: 로그·진단 파일 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs
          path: |
            crawler/crawl_data/diagnostics
            crawler/crawl_data/omissions
            crawler/crawl_summary.txt
          retention-days: 7
          if-no-files-found: ignore
